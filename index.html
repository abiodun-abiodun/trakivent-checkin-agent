<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Trakivent Check-in Station</title>

  <style>

    :root {

      --navy: #071f3b;

      --panel: #132f4d;

      --panel-light: #1b3a5b;

      --lime: #9cff00;

      --white: #ffffff;

      --muted: #a9bdd3;

      --border: rgba(156, 255, 0, 0.28);

      --danger: #ff5d67;

      --warning: #ffbf3f;

    }

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      min-height: 100vh;

      font-family: Arial, Helvetica, sans-serif;

      background: var(--navy);

      color: var(--white);

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 24px;

    }

    .page {

      width: 100%;

      max-width: 600px;

      text-align: center;

    }

    .parent-brand {

      margin-bottom: 22px;

    }

    .parent-brand-name {

      color: var(--white);

      font-size: 14px;

      font-weight: 800;

      letter-spacing: 3px;

      text-transform: uppercase;

      margin-bottom: 7px;

    }

    .parent-brand-tagline {

      color: var(--lime);

      font-size: 12px;

      letter-spacing: 0.2px;

    }

    .station {

      background: var(--panel);

      border: 1px solid var(--border);

      border-radius: 22px;

      padding: 36px;

      box-shadow:

        0 20px 60px rgba(0, 0, 0, 0.28);

    }

    .brand-area {

      margin-bottom: 30px;

    }

    .manspace-logo {

      width: 170px;

      max-width: 75%;

      height: auto;

      display: block;

      margin: 0 auto 22px;

    }

    .product-name {

      font-size: 32px;

      font-weight: 900;

      letter-spacing: 1px;

      color: var(--white);

    }

    .product-subtitle {

      color: var(--muted);

      margin-top: 8px;

      font-size: 15px;

    }

    .event-name {

      background: var(--panel-light);

      border: 1px solid rgba(255, 255, 255, 0.08);

      border-radius: 12px;

      padding: 15px;

      margin-bottom: 24px;

      font-size: 15px;

      font-weight: 700;

    }

    .action-group {

      display: flex;

      flex-direction: column;

      gap: 14px;

    }

    button {

      width: 100%;

      border: none;

      border-radius: 12px;

      padding: 17px;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

      transition:

        transform 0.15s ease,

        opacity 0.15s ease;

    }

    button:hover {

      transform: translateY(-1px);

    }

    button:active {

      transform: translateY(0);

    }

    .camera-button {

      background: transparent;

      color: var(--lime);

      border: 1px solid var(--lime);

    }

    .stop-button {

  background: #d9534f;

  color: #ffffff;

  border: none;

  margin-top: 12px;

}

.stop-button:hover {

  opacity: 0.9;

}

    .camera-button:hover {

      background: rgba(156, 255, 0, 0.08);

    }

    .manual-section {

      margin-top: 20px;

    }

    .manual-label {

      color: var(--muted);

      font-size: 12px;

      margin-bottom: 9px;

    }

    input {

      width: 100%;

      padding: 17px;

      font-size: 16px;

      text-align: center;

      color: var(--white);

      background: #0b2543;

      border: 1px solid rgba(255, 255, 255, 0.2);

      border-radius: 12px;

      outline: none;

    }

    input::placeholder {

      color: #7890aa;

    }

    input:focus {

      border-color: var(--lime);

      box-shadow:

        0 0 0 3px rgba(156, 255, 0, 0.12);

    }

    .checkin-button {

      margin-top: 14px;

      background: var(--lime);

      color: #071f3b;

    }

    .checkin-button:hover {

      opacity: 0.9;

    }

    #reader {

      width: 100%;

      margin: 20px auto;

      display: none;

      overflow: hidden;

      border-radius: 14px;

    }

    #result {

  display: none;

}

.result-overlay {

  position: fixed;

  inset: 0;

  background: rgba(7, 31, 59, 0.45);

  display: none;

  justify-content: center;

  align-items: center;

  z-index: 9999;

  padding: 20px;

}

.result-card {

  width: 100%;

  max-width: 520px;

  background: #1d4b43;

  border: 2px solid var(--lime);

  border-radius: 22px;

  padding: 40px;

  text-align: center;

  box-shadow:
    0 0 30px rgba(156,255,0,.18);

}

    #result.success .result-card {

  background: #1d4b43;

  border-color: var(--lime);

}

   #result.error .result-card {

  background: #4b2328;

  border-color: var(--danger);

}

    #statusIcon {

  font-size: 56px;

  font-weight: 900;

}

   #resultTitle {

  font-size: 24px;

  font-weight: 900;

  margin: 12px 0;

}

    #guestName {

  font-size: 30px;

  font-weight: 900;

  text-transform: uppercase;

  margin-top: 12px;

  color: var(--white);

}

    #details {

  margin-top: 14px;

  color: var(--muted);

  font-size: 16px;

  line-height: 1.8;

}

    .footer {

      margin-top: 18px;

      color: var(--muted);

      font-size: 11px;

    }

    @media (max-width: 520px) {

      body {

        padding: 16px;

      }

      .station {

        padding: 26px 20px;

      }

      .product-name {

        font-size: 28px;

      }

    }

  </style>

</head>


<body>


  <div class="page">





    <main class="station">


      <div class="brand-area">


        <img

          src="manspace-technologies-logo.png"

          alt="Manspace Technologies"

          class="manspace-logo"

        >


        <div class="product-name">

          TRAKIVENT

        </div>


        <div class="product-subtitle">

          Event Check-in Station

        </div>


      </div>
<div id="result" class="result-overlay">

  <div class="result-card">

    <div id="statusIcon"></div>

    <div id="resultTitle"></div>

    <div id="guestName"></div>

    <div id="details"></div>

  </div>

</div>

      <div class="event-name">

        Event: Test Event

      </div>


    <div class="action-group">

  <button
    id="startScannerButton"
    class="camera-button"
    type="button"
  >
    ▶ START SCANNING
  </button>

  <button
    id="stopScannerButton"
    class="camera-button stop-button"
    type="button"
    hidden
  >
    ■ STOP SCANNING
  </button>

</div>


      <div id="reader"></div>


      <div class="manual-section">


        <div class="manual-label">

          Or enter a QR token manually

        </div>


        <input

          type="text"

          id="qrInput"

          placeholder="Scan or enter QR token"

          autocomplete="off"

        >


        <button

          class="checkin-button"

          id="checkInButton"

          type="button"

        >

          CHECK IN GUEST

        </button>


      </div>


      


    </main>


    <div class="footer">

      Powered by Manspace Technologies

    </div>


  </div>


  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script src="app.js"></script>


</body>

</html>
